<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --panel: #060608;
    --border: #1e1e24;
    --text: #f2f2f5;
    --text-dim: #83838f;
    --accent: #2eff83;
    --accent-glow: rgba(46, 255, 131, 0.55);
    --user-bubble: #0f5c2a;
    --assistant-bubble: #131318;
    --hover: #131318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
  }

  /* --- sidebar --- */
  #sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  #new-chat-btn {
    margin: 12px;
    padding: 9px 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 13.5px;
    cursor: pointer;
    text-align: left;
    box-shadow: 0 0 14px var(--accent-glow);
    transition: box-shadow 0.15s ease;
  }
  #new-chat-btn:hover { box-shadow: 0 0 20px var(--accent-glow); }
  #conversation-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px;
  }
  .conv-item {
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .conv-item:hover { background: var(--hover); }
  #context-menu {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    min-width: 120px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    z-index: 100;
  }
  #context-menu .menu-item {
    padding: 7px 12px;
    border-radius: 5px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  #context-menu .menu-item:hover { background: var(--hover); }
  #context-menu .menu-item.danger { color: #ff6b6b; }
  .conv-rename-input {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  .conv-item.active {
    background: var(--hover);
    color: var(--text);
    box-shadow: inset 2px 0 0 var(--accent);
  }

  /* --- main column --- */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .title { font-weight: 600; font-size: 15px; }
  #model-select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 13px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14.5px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border: 1px solid rgba(46, 255, 131, 0.4);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.pending {
    color: var(--text-dim);
    font-style: italic;
  }
  .msg p { margin: 0 0 8px; }
  .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 4px 0 8px; padding-left: 22px; }
  .msg li { margin-bottom: 2px; }
  .msg h4, .msg h5, .msg h6 { margin: 8px 0 4px; font-size: 1em; font-weight: 600; }
  .msg h4:first-child, .msg h5:first-child, .msg h6:first-child { margin-top: 0; }
  .msg code {
    background: rgba(255,255,255,0.08);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.9em;
  }
  .msg img {
    display: block;
    max-width: 100%;
    border-radius: 10px;
    margin: 4px 0;
  }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14.5px;
    resize: none;
    font-family: inherit;
  }
  #input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 14.5px;
    box-shadow: 0 0 14px var(--accent-glow);
    transition: box-shadow 0.15s ease;
    cursor: pointer;
  }
  button:hover:not(:disabled) { box-shadow: 0 0 22px var(--accent-glow); }
  button:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
  button.stop {
    background: #ff4d4d;
    box-shadow: 0 0 14px rgba(255, 77, 77, 0.5);
  }
  button.stop:hover { box-shadow: 0 0 22px rgba(255, 77, 77, 0.5); }
</style>
</head>
<body>

<div id="sidebar">
  <button id="new-chat-btn">+ New chat</button>
  <div id="conversation-list"></div>
</div>

<div id="context-menu" hidden>
  <div class="menu-item" id="ctx-rename">Rename</div>
  <div class="menu-item danger" id="ctx-delete">Delete</div>
</div>

<div id="main">
  <header>
    <span class="title">Hermes</span>
    <select id="model-select"></select>
  </header>
  <div id="messages"></div>
  <form id="chat-form">
    <textarea id="input" rows="1" placeholder="Ask something..." autofocus></textarea>
    <button type="submit" id="send-btn">Send</button>
  </form>
</div>

<script>
const messagesEl = document.getElementById('messages');
const form = document.getElementById('chat-form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const modelSelect = document.getElementById('model-select');
const conversationListEl = document.getElementById('conversation-list');
const newChatBtn = document.getElementById('new-chat-btn');

let currentConversationId = null;

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Minimal, dependency-free markdown -> safe HTML. Escapes first, so nothing
// in the input (model output or vault content) can inject real markup —
// only the tags this function itself adds are real.
function renderMarkdown(raw) {
  const lines = escapeHtml(raw).split('\n');
  const blocks = [];
  let listBuffer = [];
  let listType = null;

  function flushList() {
    if (listBuffer.length) {
      const tag = listType === 'ol' ? 'ol' : 'ul';
      blocks.push(`<${tag}>${listBuffer.map(li => `<li>${li}</li>`).join('')}</${tag}>`);
      listBuffer = [];
      listType = null;
    }
  }

  function inline(text) {
    return text
      .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');
  }

  for (const line of lines) {
    const trimmed = line.trim();
    if (trimmed === '') continue;

    const bulletMatch = trimmed.match(/^[-*]\s+(.*)/);
    const numberedMatch = trimmed.match(/^\d+\.\s+(.*)/);
    const headerMatch = trimmed.match(/^(#{1,3})\s+(.*)/);

    if (bulletMatch) {
      if (listType !== 'ul') flushList();
      listType = 'ul';
      listBuffer.push(inline(bulletMatch[1]));
    } else if (numberedMatch) {
      if (listType !== 'ol') flushList();
      listType = 'ol';
      listBuffer.push(inline(numberedMatch[1]));
    } else {
      flushList();
      if (headerMatch) {
        const level = headerMatch[1].length + 3;
        blocks.push(`<h${level}>${inline(headerMatch[2])}</h${level}>`);
      } else {
        blocks.push(`<p>${inline(line)}</p>`);
      }
    }
  }
  flushList();

  return blocks.join('');
}

function addMessage(role, text, pending) {
  const el = document.createElement('div');
  el.className = 'msg ' + role + (pending ? ' pending' : '');
  if (role === 'assistant' && !pending) {
    el.innerHTML = renderMarkdown(text);
  } else {
    el.textContent = text;
  }
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return el;
}

function clearMessages() {
  messagesEl.innerHTML = '';
}

async function loadModels() {
  try {
    const res = await fetch('/models');
    const data = await res.json();
    modelSelect.innerHTML = data.models.map(m => `<option value="${m}">${m}</option>`).join('');
  } catch (err) {
    modelSelect.innerHTML = '<option value="">(no models found)</option>';
  }
}

async function renameConversation(id, newTitle) {
  const title = newTitle.trim();
  if (!title) return;
  await fetch('/conversations/' + id, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title }),
  });
  loadConversationList();
}

function startRename(el, conv) {
  const currentTitle = conv.title;
  el.textContent = '';
  const editInput = document.createElement('input');
  editInput.className = 'conv-rename-input';
  editInput.value = currentTitle;
  el.appendChild(editInput);
  editInput.focus();
  editInput.select();

  let settled = false;
  const commit = () => {
    if (settled) return;
    settled = true;
    renameConversation(conv.id, editInput.value);
  };
  const cancel = () => {
    if (settled) return;
    settled = true;
    loadConversationList();
  };

  editInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { e.preventDefault(); cancel(); }
  });
  editInput.addEventListener('blur', commit);
  editInput.addEventListener('click', (e) => e.stopPropagation());
}

async function deleteConversationById(id) {
  if (!confirm('Delete this conversation? This can\'t be undone.')) return;
  await fetch('/conversations/' + id, { method: 'DELETE' });
  if (id === currentConversationId) {
    currentConversationId = null;
    clearMessages();
  }
  loadConversationList();
}

// --- right-click context menu (rename / delete) ---
const contextMenu = document.getElementById('context-menu');
const ctxRename = document.getElementById('ctx-rename');
const ctxDelete = document.getElementById('ctx-delete');
let contextMenuTarget = null; // { el, conv }

function hideContextMenu() {
  contextMenu.hidden = true;
  contextMenuTarget = null;
}

function showContextMenu(x, y, el, conv) {
  contextMenuTarget = { el, conv };
  contextMenu.style.left = x + 'px';
  contextMenu.style.top = y + 'px';
  contextMenu.hidden = false;
}

ctxRename.addEventListener('click', () => {
  if (contextMenuTarget) startRename(contextMenuTarget.el, contextMenuTarget.conv);
  hideContextMenu();
});
ctxDelete.addEventListener('click', () => {
  if (contextMenuTarget) deleteConversationById(contextMenuTarget.conv.id);
  hideContextMenu();
});
document.addEventListener('click', hideContextMenu);
document.addEventListener('scroll', hideContextMenu, true);

async function loadConversationList() {
  const res = await fetch('/conversations');
  const data = await res.json();
  conversationListEl.innerHTML = '';
  for (const conv of data.conversations) {
    const el = document.createElement('div');
    el.className = 'conv-item' + (conv.id === currentConversationId ? ' active' : '');
    el.textContent = conv.title;
    el.addEventListener('click', () => openConversation(conv.id));
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      showContextMenu(e.clientX, e.clientY, el, conv);
    });
    conversationListEl.appendChild(el);
  }
}

async function openConversation(id) {
  const res = await fetch('/conversations/' + id);
  if (!res.ok) return;
  const data = await res.json();
  currentConversationId = id;
  clearMessages();
  for (const m of data.messages) {
    addMessage(m.role, m.content);
  }
  loadConversationList();
}

newChatBtn.addEventListener('click', () => {
  currentConversationId = null;
  clearMessages();
  loadConversationList();
  input.focus();
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

let isGenerating = false;
let currentAbortController = null;

function setGeneratingState(generating) {
  isGenerating = generating;
  sendBtn.textContent = generating ? 'Stop' : 'Send';
  sendBtn.classList.toggle('stop', generating);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  // While a request is in flight, the same button/Enter doubles as Stop.
  if (isGenerating) {
    if (currentAbortController) currentAbortController.abort();
    return;
  }

  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  setGeneratingState(true);

  addMessage('user', text);
  const pendingEl = addMessage('assistant', 'thinking...', true);

  currentAbortController = new AbortController();

  let fullText = '';
  let gotFirstToken = false;

  try {
    const response = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        conversation_id: currentConversationId,
        model: modelSelect.value || null,
      }),
      signal: currentAbortController.signal,
    });
    if (!response.ok) throw new Error('Request failed: ' + response.status);

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // last element may be a partial line — keep for next read

      for (const line of lines) {
        if (!line.trim()) continue;
        const event = JSON.parse(line);

        if (event.type === 'conversation_id') {
          currentConversationId = event.conversation_id;
        } else if (event.type === 'token') {
          if (!gotFirstToken) {
            gotFirstToken = true;
            pendingEl.classList.remove('pending');
          }
          fullText += event.content;
          pendingEl.textContent = fullText; // plain text while streaming; markdown rendered once at the end
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      }
    }

    pendingEl.innerHTML = renderMarkdown(fullText);
    loadConversationList();
  } catch (err) {
    if (err.name === 'AbortError') {
      // Partial text (if any) stays visible — the server already
      // persisted it, this just reflects that in the live view.
      pendingEl.classList.remove('pending');
      pendingEl.innerHTML = renderMarkdown(fullText) + '<p><em>(stopped)</em></p>';
    } else {
      pendingEl.remove();
      addMessage('assistant', 'Something went wrong: ' + err.message);
    }
  } finally {
    setGeneratingState(false);
    currentAbortController = null;
    input.focus();
  }
});

loadModels();
loadConversationList();
</script>

</body>
</html>
